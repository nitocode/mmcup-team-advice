<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MMCup 2026 — Le Grand Sondage Officiel</title>
    <meta name="description" data-i18n-content="doc.description" content="" />
    <link rel="icon" href="assets/logos/truffassons.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <!-- Decorative team logos, purely for the wallpaper effect. -->
    <div class="decor" aria-hidden="true">
      <img class="floaty f1" src="assets/logos/quichassons.png" alt="" />
      <img class="floaty f2" src="assets/logos/crepassons.png" alt="" />
      <img class="floaty f3" src="assets/logos/paillassons.png" alt="" />
      <img class="floaty f4" src="assets/logos/blairassons.png" alt="" />
      <img class="floaty f5" src="assets/logos/granfrissons.png" alt="" />
      <img class="floaty f6" src="assets/logos/smithetwessons.png" alt="" />
      <img class="floaty f7" src="assets/logos/zigouillassons.webp" alt="" />
      <img class="floaty f8" src="assets/logos/truffassons.png" alt="" />
      <span class="sparkle s1">&#10022;</span>
      <span class="sparkle s2">&#10022;</span>
      <span class="sparkle s3">&#10022;</span>
      <span class="sparkle s4">&#10022;</span>
    </div>

    <div class="lang-switch" role="group" data-i18n-aria-label="lang.switch" aria-label="">
      <button type="button" class="lang-button" data-locale="fr" lang="fr">FR</button>
      <button type="button" class="lang-button" data-locale="en" lang="en">EN</button>
    </div>

    <button id="guideDog" class="guide-dog" type="button" data-i18n-title="guideDog.title" title="">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <ellipse cx="6.3" cy="10.1" rx="2.1" ry="2.6" transform="rotate(-20 6.3 10.1)" />
        <ellipse cx="10.4" cy="6.6" rx="2.1" ry="2.8" />
        <ellipse cx="15.1" cy="6.6" rx="2.1" ry="2.8" />
        <ellipse cx="19.2" cy="10.1" rx="2.1" ry="2.6" transform="rotate(20 19.2 10.1)" />
        <path
          d="M12.7 11.3c3 0 5.4 2.3 5.4 5.1 0 2.2-1.7 3.7-3.9 3.7-.9 0-1.2-.2-1.5-.2s-.6.2-1.5.2c-2.2 0-3.9-1.5-3.9-3.7 0-2.8 2.4-5.1 5.4-5.1Z"
        />
      </svg>
      <span data-i18n="guideDog"></span>
    </button>

    <div class="ticker" aria-hidden="true">
      <div class="ticker-track">
        <span data-i18n="ticker"></span>
        <span data-i18n="ticker"></span>
      </div>
    </div>

    <main class="stage">
      <p class="kicker" data-i18n="kicker"></p>
      <h1 class="title" data-i18n="title"></h1>
      <p class="subtitle" data-i18n="subtitle"></p>

      <section class="panel">
        <span class="sticker">NEW!</span>

        <form id="voteForm" autocomplete="off" novalidate>
          <label class="field-label" for="teamInput" data-i18n="field.label"></label>
          <input
            id="teamInput"
            class="field"
            type="text"
            name="team"
            data-i18n-placeholder="field.placeholder"
            placeholder=""
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="send"
          />
          <p id="hint" class="hint" role="status">&nbsp;</p>
          <button class="vote-button" type="submit" data-i18n="vote"></button>
        </form>

        <p class="fineprint" data-i18n="fineprint"></p>
      </section>

      <div class="counter" aria-hidden="true">
        <span class="counter-label" data-i18n="counter.label"></span>
        <span class="counter-digits" id="counter">0000137</span>
      </div>

      <footer class="footer">
        <span class="badge" data-i18n="badge.viewed"></span>
        <span class="badge" data-i18n="badge.ie"></span>
        <span class="badge" data-i18n="badge.powered"></span>
        <p class="copyright" data-i18n="copyright"></p>
      </footer>
    </main>

    <div id="videoModal" class="modal" hidden>
      <div id="modalBackdrop" class="modal-backdrop"></div>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-bar">
          <span id="modalTitle" class="modal-title" data-i18n="modal.title"></span>
          <button
            id="modalClose"
            class="modal-close"
            type="button"
            data-i18n-aria-label="modal.close"
            aria-label=""
          >
            &times;
          </button>
        </div>
        <div class="modal-video">
          <video id="verdictVideo" class="modal-media" playsinline controls preload="auto">
            <source src="assets/video/verdict.mp4" type="video/mp4" />
          </video>
        </div>
        <p class="modal-foot">
          <span id="modalNote" data-i18n="modal.note"></span>
          <button
            id="unmuteButton"
            class="modal-unmute"
            type="button"
            data-i18n="modal.unmute"
            hidden
          ></button>
        </p>
      </div>
    </div>

    <script src="assets/i18n.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
